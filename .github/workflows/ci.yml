name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Packs the tarball, installs it in a throwaway project and imports it
      # from plain Node ESM, as an npm user would.
      - name: Smoke test the packed tarball with React 18
        run: npm run smoke -- 18
      - name: Smoke test the packed tarball with React 19
        run: npm run smoke -- 19
